<svg xmlns="http://www.w3.org/2000/svg" width="869" height="330" viewBox="0 0 869 330" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="hbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#09090b"/>
      <stop offset="1" stop-color="#09090b"/>
    </linearGradient>
    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
  </defs>

  <!-- Window Frame -->
  <rect width="869" height="330" rx="12" fill="url(#hbg)"/>
  <rect x="0.5" y="0.5" width="868" height="329" rx="12" fill="none" stroke="#27272a" stroke-width="1" stroke-opacity="0.55"/>
  <line x1="0" y1="30" x2="869" y2="30" stroke="#27272a" stroke-opacity="0.35"/>

  <!-- Window Controls -->
  <circle cx="22" cy="15" r="5" fill="#ff5f56"/>
  <circle cx="38" cy="15" r="5" fill="#ffbd2e"/>
  <circle cx="54" cy="15" r="5" fill="#27c93f"/>
  <text x="434.5" y="19" fill="#71717a" font-size="12" text-anchor="middle">sanyam@github: ~/architecture --visualize</text>

  <!-- ================= NODES ================= -->

  <!-- Fedora Silverblue -->
  <rect x="40" y="65" width="340" height="75" rx="8" fill="#0d0d11" stroke="#27272a" stroke-width="1.5"/>
  <text x="55" y="90" fill="#e4e4e7" font-size="14" font-weight="700">Fedora Silverblue</text>
  <text x="55" y="110" fill="#71717a" font-size="11">Local Workstation (Immutable Host OS)</text>
  <text x="55" y="126" fill="#a1a1aa" font-size="10">Provides isolated container build toolboxes.</text>

  <!-- Proxmox Homelab -->
  <rect x="489" y="65" width="340" height="75" rx="8" fill="#0d0d11" stroke="#27272a" stroke-width="1.5"/>
  <text x="504" y="90" fill="#e4e4e7" font-size="14" font-weight="700">Proxmox Homelab</text>
  <text x="504" y="110" fill="#71717a" font-size="11">Self-Hosted Infrastructure Layer</text>
  <text x="504" y="126" fill="#a1a1aa" font-size="10">Orchestrates system networks, LXC &amp; VMs.</text>

  <!-- Context Pilot MCP -->
  <rect x="40" y="225" width="340" height="75" rx="8" fill="#0d0d11" stroke="#27272a" stroke-width="1.5"/>
  <text x="55" y="250" fill="#e4e4e7" font-size="14" font-weight="700">Context Pilot MCP</text>
  <text x="55" y="270" fill="#71717a" font-size="11">AST-Compressed Context Engine</text>
  <text x="55" y="286" fill="#a1a1aa" font-size="10">Optimizes context windows during AI dev loops.</text>

  <!-- CampusGrid -->
  <rect x="489" y="225" width="340" height="75" rx="8" fill="#0d0d11" stroke="#27272a" stroke-width="1.5"/>
  <text x="504" y="250" fill="#e4e4e7" font-size="14" font-weight="700">CampusGrid</text>
  <text x="504" y="270" fill="#71717a" font-size="11">Decentralized P2P Compute Sandbox</text>
  <text x="504" y="286" fill="#a1a1aa" font-size="10">Schedules ML container runs across cluster nodes.</text>

  <!-- ================= ARROWS & LABELS ================= -->

  <!-- Top Arrow (Silverblue -> Proxmox) -->
  <path d="M 380 102.5 L 479 102.5" stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="434.5" y="94" fill="#3b82f6" font-size="10" font-weight="bold" text-anchor="middle">provisions &amp; manages</text>

  <!-- Right Arrow (Proxmox -> CampusGrid) -->
  <path d="M 659 140 L 659 215" stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="669" y="182" fill="#3b82f6" font-size="10" font-weight="bold" text-anchor="start">hosts worker nodes</text>

  <!-- Bottom Arrow (CampusGrid -> Context Pilot) -->
  <path d="M 489 262.5 L 390 262.5" stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="439.5" y="254" fill="#3b82f6" font-size="10" font-weight="bold" text-anchor="middle">optimizes dev token usage</text>

  <!-- Left Arrow (Context Pilot -> Silverblue) -->
  <path d="M 210 225 L 210 150" stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="200" y="192" fill="#3b82f6" font-size="10" font-weight="bold" text-anchor="end">accelerates coding loops</text>

</svg>
