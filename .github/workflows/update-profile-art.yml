name: Update profile art

# Manually triggered profile art update (scheduled updates disabled while activity is hidden)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Build profile README and assets
        run: python scripts/build_profile.py
        env:
          GH_PROFILE_USER: Sanyam-Ahuja

      - name: Commit updated files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile contributions [skip ci]"
          file_pattern: "data/contributions.json sanyam-heatmap.svg README.md"
