name: Update profile art

# Refreshes the contribution graph SVG on a cadence.
# Runs every 2 days, plus whenever you push to main, plus on-demand.

on:
  schedule:
    - cron: "0 0 */2 * *"   # runs every 2 days
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Build profile README and assets
        run: python scripts/build_profile.py
        env:
          GH_PROFILE_USER: Sanyam-Ahuja

      - name: Commit updated files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile contributions [skip ci]"
          file_pattern: "data/contributions.json sanyam-heatmap.svg README.md"
